<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">

  <defs>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0f0709"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="red-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4458"/>
      <stop offset="40%" stop-color="#ff1a35"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff2a45"/>

      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#ff4d6d"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambient-blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30"
            fill="none"
            stroke="#ef4444"
            stroke-width="0.75"
            stroke-opacity="0.08"/>
    </pattern>

  </defs>

  <style>
    .title-text{
      font-family:Segoe UI,Arial,sans-serif;
      font-weight:900;
      font-size:42px;
      letter-spacing:4px;
      text-transform:uppercase;
    }

    .subtitle-text{
      font-family:Segoe UI,Arial,sans-serif;
      font-weight:600;
      font-size:15px;
      letter-spacing:3px;
      text-transform:uppercase;
      fill:#e2e8f0;
    }

    .badge-text{
      font-family:Segoe UI,Arial,sans-serif;
      font-weight:700;
      font-size:12px;
      letter-spacing:1.5px;
      text-transform:uppercase;
      fill:#ff4d6d;
    }
  </style>

  <rect width="900" height="220" rx="14" fill="url(#bg-grad)"/>

  <circle cx="150" cy="70" r="90"
          fill="#dc2626"
          opacity="0.18"
          filter="url(#ambient-blur)"/>

  <circle cx="750" cy="120" r="110"
          fill="#ff1a35"
          opacity="0.14"
          filter="url(#ambient-blur)"/>

  <rect width="900" height="220" rx="14" fill="url(#tech-grid)"/>

  <rect x="1.5" y="1.5"
        width="897"
        height="217"
        rx="13"
        fill="none"
        stroke="url(#border-grad)"
        stroke-width="1.5"
        stroke-opacity="0.65"/>

  <g transform="translate(315,24)">
    <rect width="270" height="26" rx="13"
          fill="#17090b"
          stroke="#ff2a45"
          stroke-width="1"/>

    <text x="135"
          y="17"
          text-anchor="middle"
          class="badge-text">
      BUILDING AI PRODUCTS
    </text>
  </g>

  <text x="450"
        y="105"
        text-anchor="middle"
        class="title-text"
        fill="url(#red-glow-grad)"
        filter="url(#glow-red)">
    NIRANJAN R
  </text>

  <text x="450"
        y="105"
        text-anchor="middle"
        class="title-text"
        fill="#ffffff">
    NIRANJAN R
  </text>

  <text x="450"
        y="142"
        text-anchor="middle"
        class="subtitle-text">

    <tspan fill="#ff4d6d">GENAI DEVELOPER</tspan>
    <tspan fill="#64748b"> • </tspan>
    <tspan fill="#f1f5f9">AGENTIC AI</tspan>
    <tspan fill="#64748b"> • </tspan>
    <tspan fill="#ff4d6d">PYTHON & FASTAPI</tspan>

  </text>

  <g transform="translate(0,160)">
    <line x1="200" y1="0" x2="420" y2="0"
          stroke="url(#border-grad)"
          stroke-width="1.5"/>

    <polygon points="450,-5 455,0 450,5 445,0"
             fill="#ef4444"/>

    <line x1="480" y1="0" x2="700" y2="0"
          stroke="url(#border-grad)"
          stroke-width="1.5"/>
  </g>

  <text x="450"
        y="192"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="12"
        font-weight="600"
        fill="#94a3b8"
        letter-spacing="1.5">

    <tspan fill="#ef4444">&lt;/&gt;</tspan>
    TURNING IDEAS INTO INTELLIGENT AI APPLICATIONS

  </text>

</svg>
